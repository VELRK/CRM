<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atrium</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="app.css?v=20261101j">
</head>
<body>
    <style>
        #boot { min-height: 100vh; display: grid; place-items: center; background: #e7f4ec; margin: 0; }
        #boot > * { grid-area: 1 / 1; }
        #boot-mark, #boot-logo { width: 72px; height: 72px; border-radius: 16px; }
        #boot-mark { background: #0E8A4A; color: #fff; display: grid; place-items: center; }
        #boot-logo { object-fit: cover; }
        #boot-mark[hidden], #boot-logo[hidden] { display: none !important; }
    </style>
    <div id="boot">
        <span id="boot-mark">
            <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 20V9l8-5 8 5v11"/><path d="M9 20v-6h6v6"/></svg>
        </span>
        <img id="boot-logo" alt="" hidden>
    </div>
    <div id="root"></div>
    <script>
        window.__atriumBoot = new Promise(function (resolve) {
            var finished = false;
            function finish() {
                if (!finished) {
                    finished = true;
                    resolve();
                }
            }
            setTimeout(finish, 4000);
            var token = localStorage.getItem('atrium-token');
            if (!token) {
                finish();
                return;
            }
            var logoUrl = new URL('../api/v1/company/logo', location.href);
            fetch(logoUrl, { headers: { Authorization: 'Bearer ' + token } })
                .then(function (response) { return response.ok ? response.blob() : null; })
                .then(function (blob) {
                    if (!blob) return;
                    var img = document.getElementById('boot-logo');
                    var mark = document.getElementById('boot-mark');
                    window.__atriumLogo = URL.createObjectURL(blob);
                    if (mark) mark.hidden = true;
                    if (img) {
                        img.src = window.__atriumLogo;
                        img.hidden = false;
                    }
                })
                .catch(function () {})
                .finally(finish);
        });
    </script>
    <script type="module" src="app.js?v=20261101j"></script>
</body>
</html>
