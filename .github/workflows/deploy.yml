name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -rlgoDzvc --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.env' \
            --exclude='/vendor/' \
            --exclude='/frontend/' \
            --exclude='/writable/logs/' \
            --exclude='/writable/cache/' \
            --exclude='/writable/session/' \
            --exclude='/writable/uploads/' \
            --exclude='/writable/debugbar/' \
            --exclude='/writable/cookies.txt' \
            --exclude='/.DS_Store' \
            --exclude='/node_modules/' \
            --exclude='/nbproject/' \
            --exclude='/.idea/' \
            ./ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_TARGET_DIR }}
