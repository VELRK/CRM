name: Deploy to Hostinger

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -t ed25519 -p "${{ secrets.SSH_PORT }}" "${{ secrets.SSH_HOST }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts

      - name: Deploy via rsync
        run: |
          rsync -rlgoDzvc --delete \
            -e "ssh -p ${{ secrets.SSH_PORT }} -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            --exclude='/.git/' \
            --exclude='/.github/' \
            --exclude='/.env' \
            --exclude='/frontend/' \
            --exclude='/writable/logs/' \
            --exclude='/writable/cache/' \
            --exclude='/writable/session/' \
            --exclude='/writable/uploads/' \
            --exclude='/writable/debugbar/' \
            --exclude='/writable/cookies.txt' \
            --exclude='/.DS_Store' \
            --exclude='/node_modules/' \
            --exclude='/nbproject/' \
            --exclude='/.idea/' \
            ./ ${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}:${{ secrets.SSH_TARGET_DIR }}

      - name: Prepare writable directories
        run: |
          ssh -p "${{ secrets.SSH_PORT }}" -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "${{ secrets.SSH_USERNAME }}@${{ secrets.SSH_HOST }}" \
            "mkdir -p '${{ secrets.SSH_TARGET_DIR }}/writable/logs' '${{ secrets.SSH_TARGET_DIR }}/writable/cache' '${{ secrets.SSH_TARGET_DIR }}/writable/session' '${{ secrets.SSH_TARGET_DIR }}/writable/uploads' '${{ secrets.SSH_TARGET_DIR }}/writable/debugbar' && chmod -R 775 '${{ secrets.SSH_TARGET_DIR }}/writable'"
